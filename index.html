<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonia's Survey Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="title">Sonia's Lifestyle Survey</h1>
      <p id="description">
        Help us get to know you better! Fill out this quick survey and share your thoughts.
      </p>

      <form id="survey-form">

        <!-- Name -->
        <div class="form-group">
          <label id="name-label" for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label id="email-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
          />
        </div>

        <!-- Number -->
        <div class="form-group">
          <label id="number-label" for="number">Age</label>
          <input
            type="number"
            id="number"
            name="age"
            placeholder="Enter your age (10–100)"
            min="10"
            max="100"
          />
        </div>

        <!-- Dropdown -->
        <div class="form-group">
          <label for="dropdown">What best describes you?</label>
          <select id="dropdown" name="role">
            <option value="" disabled selected>Select an option</option>
            <option value="student">Student</option>
            <option value="professional">Working Professional</option>
            <option value="freelancer">Freelancer</option>
            <option value="other">Other</option>
          </select>
        </div>

        <!-- Radio Buttons -->
        <div class="form-group">
          <label>How did you hear about us?</label>
          <div class="radio-group">
            <label><input type="radio" name="source" value="social-media" /> Social Media</label>
            <label><input type="radio" name="source" value="friend" /> A Friend</label>
            <label><input type="radio" name="source" value="search" /> Search Engine</label>
            <label><input type="radio" name="source" value="other" /> Other</label>
          </div>
        </div>

        <!-- Checkboxes -->
        <div class="form-group">
          <label>What topics interest you? (Select all that apply)</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="interests" value="travel" /> Travel</label>
            <label><input type="checkbox" name="interests" value="fitness" /> Fitness</label>
            <label><input type="checkbox" name="interests" value="cooking" /> Cooking</label>
            <label><input type="checkbox" name="interests" value="technology" /> Technology</label>
            <label><input type="checkbox" name="interests" value="art" /> Art & Design</label>
          </div>
        </div>

        <!-- Textarea -->
        <div class="form-group">
          <label for="comments">Any additional comments or suggestions?</label>
          <textarea
            id="comments"
            name="comments"
            rows="5"
            placeholder="Share your thoughts here..."
          ></textarea>
        </div>

        <!-- Submit -->
        <button id="submit" type="submit">Submit Survey</button>

      </form>
    </div>
  </body>
</html>
